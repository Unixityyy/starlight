<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Starlight Playlists</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="/auth.js"></script>
  <style>
    body {
      background-color: #1a1a2e;
      font-family: Inter, sans-serif;
    }

    .card {
      background: #27273f;
      border: 1px solid #3d3d5f;
      border-radius: 12px;
      transition: .2s;
      text-decoration: none;
      color: white;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,.5);
      border-color: #0d6efd;
    }

    .card-icon-wrapper {
      padding-top: 3rem;
      padding-bottom: 1rem;
      display: flex;
      justify-content: center;
      color: #0d6efd;
    }

    header h1 {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      color: #0d6efd;
      margin-bottom: .5rem;
    }

    .warning-banner {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid #ffc107;
      color: #ffc107;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      max-width: 650px;
      margin: 0 auto 2.5rem auto;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="text-white">

<nav class="mb-4"></nav>
<script type="module" src="/navbar.js"></script>

<div class="container py-4">
  <header class="mb-4">
    <h1>Starlight Playlists</h1>
    <div class="warning-banner">
      <strong>Note:</strong> Starlight Playlists are an experimental feature, there may be bugs!
    </div>
  </header>

  <div id="playlist-grid" class="row justify-content-center g-4">
    <div class="col-md-5 col-lg-4">
      <a href="/playlists/player" class="card h-100 shadow-lg">
        <div class="card-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
            <path d="M12 13c0 1.105-1.12 2-2.5 2S7 14.105 7 13s1.12-2 2.5-2 2.5.895 2.5 2z"/>
            <path fill-rule="evenodd" d="M12 3v10h-1V3h1z"/>
            <path d="M11 2.82a1 1 0 0 1 .804-.98l3-.6A1 1 0 0 1 16 2.22V4l-5 1V2.82zM0 11.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5zm0-4A.5.5 0 0 1 .5 7H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5zm0-4A.5.5 0 0 1 .5 3H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5z"/>
          </svg>
        </div>
        <div class="card-body text-center pb-5">
          <h4 class="fw-bold">Playlist Player</h4>
          <p class="text-secondary small">Listen to your collections</p>
          <span class="btn btn-outline-primary mt-3 px-4 w-100">Launch</span>
        </div>
      </a>
    </div>

    <div class="col-md-5 col-lg-4">
      <a href="/playlists/editor" class="card h-100 shadow-lg">
        <div class="card-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
            <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z"/>
          </svg>
        </div>
        <div class="card-body text-center pb-5">
          <h4 class="fw-bold">Playlist Editor</h4>
          <p class="text-secondary small">Edit playlists quickly and easily</p>
          <span class="btn btn-outline-primary mt-3 px-4 w-100">Edit</span>
        </div>
      </a>
    </div>
  </div>
</div>

<script src="./starlight.js"></script>
</body>
</html>
