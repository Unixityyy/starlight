<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color:#1a1a2e; font-family:Inter,sans-serif; overflow-x: hidden; color: white; }
    .card { background:#27273f; border:1px solid #3d3d5f; border-radius:12px; }
    .view { display: none; padding-bottom: 140px; }
    .view.active { display: block; }
    .menu-card { cursor: pointer; transition: 0.3s; background: #27273f; border: 2px solid #3d3d5f; padding: 40px 20px; text-align: center; }
    .menu-card:hover { border-color: #0d6efd; transform: translateY(-5px); background: #2d2d4d; }
    .menu-card i { font-size: 3.5rem; color: #0d6efd; display: block; margin-bottom: 10px; }
    .list-group-item { background:#27273f; border:1px solid #3d3d5f; color: white; transition: 0.2s; cursor: pointer; margin-bottom: 8px; border-radius: 8px !important; }
    .list-group-item:hover { background:#3d3d5f; border-color: #0d6efd; }
    .list-group-item.active-song { border-left: 5px solid #0d6efd; background: #2d2d4d; }
    .progress { height:8px; cursor:pointer; background: #1a1a2e; }
    .mini-player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #27273f; border-top: 2px solid #0d6efd; padding: 15px; z-index: 1000; display: none; box-shadow: 0 -10px 20px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

<div class="container py-4">
  <div id="view-menu" class="view active">
    <header class="mb-5 text-center">
      <h1 class="display-3 fw-bold text-primary">Starlight</h1>
      <p class="text-secondary">Seamless Audio Everywhere</p>
    </header>
    <div class="row g-4 justify-content-center">
      <div class="col-md-5"><div class="card menu-card shadow-lg" onclick="openLibrary()"><i class="bi bi-music-note-list"></i><h3>Library</h3></div></div>
      <div class="col-md-5"><div class="card menu-card shadow-lg" onclick="showView('view-playlists')"><i class="bi bi-collection-play"></i><h3>Playlists</h3></div></div>
    </div>
  </div>

  <div id="view-content" class="view">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-primary me-3" onclick="showView('view-menu')"><i class="bi bi-chevron-left"></i></button>
            <h2 id="content-title" class="m-0">Library</h2>
        </div>
        <button id="unload-btn" class="btn btn-danger btn-sm d-none" onclick="unloadPlaylist()">Unload SLP</button>
    </div>
    <div class="card p-3"><div class="list-group list-group-flush" id="song-list"></div></div>
  </div>

  <div id="view-playlists" class="view">
    <div class="d-flex align-items-center mb-4"><button class="btn btn-outline-primary me-3" onclick="showView('view-menu')"><i class="bi bi-chevron-left"></i></button><h2>Playlists</h2></div>
    <div class="card p-5 text-center">
        <i class="bi bi-file-earmark-arrow-up text-primary display-1 mb-3"></i>
        <h4>Load .SLP File</h4>
        <input type="file" id="slp-upload" hidden accept=".slp">
        <button class="btn btn-primary btn-lg mt-3" onclick="document.getElementById('slp-upload').click()">Choose File</button>
    </div>
  </div>
</div>

<div class="mini-player-bar" id="player-bar">
    <div class="container"><div class="row align-items-center">
        <div class="col-4 d-flex align-items-center gap-3">
            <img id="bar-cover" src="" style="width:45px; height:45px; border-radius:6px; object-fit:cover;">
            <div class="text-truncate"><h6 id="bar-title" class="m-0 text-primary fw-bold text-truncate">Title</h6><small id="bar-artist" class="text-secondary text-truncate">Artist</small></div>
        </div>
        <div class="col-5">
            <div class="progress mb-1" id="progressBar" onclick="seek(event)"><div class="progress-bar bg-primary" id="progress" style="width: 0%"></div></div>
            <div class="d-flex justify-content-between small text-secondary"><span id="time-cur">0:00</span><span id="time-dur">0:00</span></div>
        </div>
        <div class="col-3 d-flex justify-content-end align-items-center gap-3">
            <i id="loopBtn" class="bi bi-arrow-repeat fs-4 opacity-50" onclick="toggleLoop()" style="cursor:pointer"></i>
            <i id="playPause" class="bi bi-play-circle-fill text-primary" style="font-size: 2.5rem; cursor:pointer;" onclick="togglePlay()"></i>
            <i class="bi bi-skip-end-fill fs-3" style="cursor:pointer;" onclick="skip(1)"></i>
        </div>
    </div></div>
</div>

<script src="https://unixityyy.github.io/starlight/starlight.js"></script>
<script>
  const BASE = "https://unixityyy.github.io/starlight";
  let curQueue = [], idx = -1, curSong = null, isLooping = false, activeView = 'view-menu';
  let isPlaylistMode = false;

  const fix = (p) => (p && p.startsWith('http')) ? p : BASE + (p ? (p.startsWith('/') ? p : '/' + p) : '');
  const fmt = (s) => { if(!s || isNaN(s)) return "0:00"; const m=Math.floor(s/60), r=Math.floor(s%60); return `${m}:${r<10?'0':''}${r}`; };

  function showView(id) {
    activeView = id;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    saveState();
  }

  function openLibrary() {
    isPlaylistMode = false;
    document.getElementById('content-title').textContent = "Library";
    document.getElementById('unload-btn').classList.add('d-none');
    curQueue = window.STARLIGHT_SONGS;
    renderSongs(curQueue);
    showView('view-content');
  }

  function renderSongs(songs) {
    const list = document.getElementById('song-list');
    list.innerHTML = '';
    songs.forEach(s => {
      const li = document.createElement('div');
      li.className = `list-group-item d-flex justify-content-between align-items-center p-3 ${curSong?.id === s.id ? 'active-song' : ''}`;
      li.innerHTML = `<div class="d-flex align-items-center gap-3"><img src="${fix(s.cover)}" style="width:40px; height:40px; border-radius:4px; object-fit:cover;"><div><div class="fw-bold text-truncate">${s.title}</div><div class="small text-secondary text-truncate">${s.artist}</div></div></div>`;
      li.onclick = () => playSong(s, songs);
      list.appendChild(li);
    });
  }

  function playSong(song, queue, isRestore = false) {
    if(!song) return;
    curSong = song; curQueue = queue;
    idx = curQueue.findIndex(s => s.id === song.id);
    document.getElementById('player-bar').style.display = 'block';
    document.getElementById('bar-title').textContent = song.title;
    document.getElementById('bar-artist').textContent = song.artist;
    document.getElementById('bar-cover').src = fix(song.cover);
    if (!isRestore) window.parent.postMessage({ target: 'offscreen', command: 'play', url: fix(song.file), song: song }, "*");
    saveState();
  }

  function unloadPlaylist() { openLibrary(); }
  function togglePlay() { window.parent.postMessage({ target: 'offscreen', command: 'toggle' }, "*"); }
  function toggleLoop() { isLooping = !isLooping; document.getElementById('loopBtn').classList.toggle('opacity-50', !isLooping); window.parent.postMessage({ target: 'offscreen', command: 'loop', state: isLooping }, "*"); }
  function seek(e) { const pct = e.offsetX / e.currentTarget.clientWidth; window.parent.postMessage({ target: 'offscreen', command: 'seek', pct }, "*"); }
  function skip(d) { const n = curQueue[idx + d]; if(n) playSong(n, curQueue); }

  function saveState() {
    // We save the IDs of the queue so we can rebuild it later
    const queueIds = curQueue.map(s => s.id);
    window.parent.postMessage({ type: 'SAVE_STATE', payload: { song: curSong, queueIds, view: activeView, isPlaylistMode } }, "*");
  }

  document.getElementById('slp-upload').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
          const ids = ev.target.result.split('\n').map(x => x.trim());
          const pl = ids.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
          if (pl.length) {
              isPlaylistMode = true;
              document.getElementById('content-title').textContent = "Playlist Mode";
              document.getElementById('unload-btn').classList.remove('d-none');
              renderSongs(pl); 
              showView('view-content'); 
              playSong(pl[0], pl);
          }
      };
      reader.readAsText(e.target.files[0]);
  };

  window.addEventListener("message", (e) => {
    if (e.data.type === 'UI_STATE') document.getElementById('playPause').className = e.data.playing ? 'bi bi-pause-circle-fill' : 'bi bi-play-circle-fill';
    if (e.data.type === 'UI_PROG') {
      document.getElementById('progress').style.width = `${(e.data.c / e.data.d) * 100}%`;
      document.getElementById('time-cur').textContent = fmt(e.data.c);
      document.getElementById('time-dur').textContent = fmt(e.data.d);
    }
    if (e.data.type === 'UI_NEXT') skip(1);

    // --- RESTORATION LOGIC ---
    if (e.data.type === 'RESTORE_STATE' && e.data.payload) {
        const d = e.data.payload;
        
        // 1. Rebuild the Queue from Saved IDs
        if (d.queueIds && d.queueIds.length > 0) {
            curQueue = d.queueIds.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
        } else {
            curQueue = window.STARLIGHT_SONGS;
        }

        // 2. Setup Playlist UI if needed
        isPlaylistMode = d.isPlaylistMode;
        if (isPlaylistMode) {
            document.getElementById('content-title').textContent = "Playlist Mode";
            document.getElementById('unload-btn').classList.remove('d-none');
        }

        // 3. Restore the View and Song
        if (d.song) playSong(d.song, curQueue, true);
        if (d.view) {
            activeView = d.view;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(d.view).classList.add('active');
        }
        renderSongs(curQueue);
    }
  });

  window.onload = () => { 
      // Delay state request slightly to ensure library is loaded
      setTimeout(() => {
          window.parent.postMessage({ type: 'GET_STATE' }, "*"); 
      }, 100);
  };
</script>
</body>
</html>
