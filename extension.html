<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --bg: #1a1a2e; --card: #27273f; --accent: #0d6efd; --border: #3d3d5f; }
    body { 
      background: var(--bg); color: white; font-family: 'Inter', sans-serif;
      height: 600px; width: 400px; overflow: hidden; margin: 0; position: relative;
    }
    .view { display: none; height: 100%; flex-direction: column; padding: 20px; position: absolute; width: 100%; }
    .view.active { display: flex; }
    
    /* Website-Style Components */
    .starlight-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; cursor: pointer;
      transition: 0.2s; text-align: center; margin-bottom: 12px;
    }
    .starlight-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .explicit-tag { background: #5d3587; color: white; font-size: .65rem; padding: 1px 4px; border-radius: 3px; font-weight: 700; }
    
    .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 90px; }
    
    .song-card {
      display: flex; align-items: center; gap: 12px; padding: 10px;
      border-radius: 10px; cursor: pointer; margin-bottom: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid transparent;
    }
    .song-card.active { border-left: 4px solid var(--accent); background: #2d2d4d; }
    .song-card img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; aspect-ratio: 1/1; }

    /* Bottom Bar */
    .player-bar {
      background: #27273f; border-top: 1px solid var(--border);
      padding: 10px 15px; position: absolute; bottom: 0; width: 100%; z-index: 500;
    }

    /* Full Player UI */
    #v-player { background: var(--bg); z-index: 1000; }
    .big-art { 
      width: 260px; height: 260px; object-fit: cover; border-radius: 16px;
      margin: 15px auto; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .progress-wrap { height: 6px; background: #1a1a2e; border-radius: 3px; width: 100%; cursor: pointer; margin: 15px 0; }
    .progress-inner { height: 100%; background: var(--accent); width: 0%; border-radius: 3px; }

    /* Toggles */
    .form-switch .form-check-input { cursor: pointer; }
  </style>
</head>
<body>

  <div id="v-menu" class="view active">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary mb-0">Starlight</h1>
        <p class="small text-secondary">Sound Player</p>
    </div>
    <div class="starlight-card" onclick="initView('library')">
        <i class="bi bi-music-note-list fs-1 text-primary"></i>
        <h5 class="mt-2">Library</h5>
    </div>
    <div class="starlight-card" onclick="activeView='playlists'; switchDOM();">
        <i class="bi bi-collection-play fs-1 text-primary"></i>
        <h5 class="mt-2">Playlists</h5>
    </div>
    <div class="d-flex justify-content-center mt-auto mb-4">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="cleanToggle">
          <label class="form-check-label small" for="cleanToggle">Clean Mode</label>
        </div>
    </div>
  </div>

  <div id="v-playlists" class="view">
    <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-chevron-left fs-4" style="cursor:pointer" onclick="goHome()"></i>
        <h4 class="m-0 fw-bold">Playlists</h4>
    </div>
    <div class="starlight-card" onclick="document.getElementById('slp-file').click()">
        <i class="bi bi-file-earmark-arrow-up fs-2 text-primary"></i>
        <p class="m-0 mt-2 fw-bold">Import SLP File</p>
        <p class="small text-secondary">Load a custom queue</p>
        <input type="file" id="slp-file" hidden accept=".slp">
    </div>
    <div id="playlist-status" class="text-center text-secondary mt-4">
        <i class="bi bi-info-circle me-1"></i> No active playlist loaded
    </div>
  </div>

  <div id="v-list" class="view">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-chevron-left fs-4" style="cursor:pointer" onclick="goHome()"></i>
        <h4 id="list-title" class="m-0 fw-bold">Library</h4>
      </div>
    </div>
    <div class="scroll-area" id="song-container"></div>
  </div>

  <div id="v-player" class="view">
    <div class="d-flex justify-content-between align-items-center">
        <i class="bi bi-chevron-down fs-3" onclick="activeView='list'; switchDOM();"></i>
        <span class="small fw-bold opacity-50">NOW PLAYING</span>
        <i id="loopBtn" class="bi bi-arrow-repeat fs-3 opacity-50" onclick="toggleLoop()"></i>
    </div>
    <img id="full-art" class="big-art" src="">
    <div class="text-center mt-2">
        <h4 id="full-title" class="fw-bold mb-0 text-truncate">Title</h4>
        <p id="full-artist" class="text-primary mb-1">Artist</p>
        <span id="full-explicit" class="explicit-tag" style="display:none">E</span>
    </div>
    <div class="progress-wrap" onclick="handleSeek(event)">
        <div class="progress-inner" id="full-progress"></div>
    </div>
    <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
        <i class="bi bi-skip-start-fill fs-1" onclick="skip(-1)"></i>
        <i id="full-play-btn" class="bi bi-play-circle-fill" style="font-size: 4rem;" onclick="togglePlay()"></i>
        <i class="bi bi-skip-end-fill fs-1" onclick="skip(1)"></i>
    </div>
    <div class="scroll-area mt-2" id="player-queue"></div>
  </div>

  <div class="player-bar" id="p-bar" style="display:none" onclick="activeView='player'; switchDOM();">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2 overflow-hidden">
        <img id="p-cover" src="" style="width:38px; height:38px; border-radius:4px; object-fit:cover;">
        <div class="text-truncate">
          <div id="p-title" class="fw-bold small text-truncate" style="max-width: 140px;">Title</div>
          <div id="p-artist" class="text-secondary" style="font-size:10px;">Artist</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <i id="btn-play" class="bi bi-play-fill fs-2" onclick="togglePlay(event)"></i>
        <i class="bi bi-skip-end-fill fs-3" onclick="skip(1, event)"></i>
      </div>
    </div>
    <div style="height:2px; background:#1a1a2e; margin-top:8px;">
        <div id="p-progress" style="height:100%; background:var(--accent); width:0%;"></div>
    </div>
  </div>

  <script src="https://unixityyy.github.io/starlight/starlight.js"></script>
  <script>
    const BASE = "https://unixityyy.github.io/starlight";
    let queue = [], currentSong = null, activeView = 'menu', isPlaylist = false, isLooping = false;
    let cleanMode = localStorage.getItem('cleanEnabled') === 'true';

    const fix = (p) => (p && p.startsWith('http')) ? p : BASE + (p ? (p.startsWith('/') ? p : '/' + p) : '');
    const getFile = (s) => (cleanMode && s.file_clean) ? s.file_clean : s.file;

    function save() {
      localStorage.setItem('starlight_cache', JSON.stringify({
        view: activeView, currentId: currentSong?.id,
        queueIds: queue.map(s => s.id), isPlaylist, isLooping
      }));
    }

    function initView(mode) {
      activeView = 'list';
      if (mode === 'library') {
        queue = window.STARLIGHT_SONGS;
        isPlaylist = false;
        document.getElementById('list-title').innerText = "Library";
      }
      render(); switchDOM();
    }

    function goHome() { activeView = 'menu'; switchDOM(); }

    function switchDOM() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('v-' + activeView).classList.add('active');
      save();
    }

    function render() {
      const listCont = document.getElementById('song-container');
      const playerCont = document.getElementById('player-queue');
      [listCont, playerCont].forEach(c => c.innerHTML = '');

      queue.forEach(s => {
        const isActive = currentSong?.id === s.id;
        const html = `
          <img src="${fix(s.cover)}">
          <div class="text-truncate flex-grow-1">
            <div class="fw-bold small">${s.title}</div>
            <div class="text-secondary" style="font-size:11px">${s.artist}</div>
          </div>
          ${s.isExplicit ? '<span class="explicit-tag">E</span>' : ''}`;
        
        const div = document.createElement('div');
        div.className = `song-card ${isActive ? 'active' : ''}`;
        div.innerHTML = html;
        div.onclick = (e) => { e.stopPropagation(); play(s); };
        
        listCont.appendChild(div);
        playerCont.appendChild(div.cloneNode(true));
        // Re-bind click for the cloned node
        playerCont.lastChild.onclick = (e) => { e.stopPropagation(); play(s); };
      });
    }

    function play(song, restore = false) {
      currentSong = song;
      document.getElementById('p-bar').style.display = 'block';
      
      const update = (id, val) => document.getElementById(id).innerText = val;
      update('p-title', song.title); update('full-title', song.title);
      update('p-artist', song.artist); update('full-artist', song.artist);
      
      document.getElementById('p-cover').src = fix(song.cover);
      document.getElementById('full-art').src = fix(song.cover);
      document.getElementById('full-explicit').style.display = song.isExplicit ? 'inline-block' : 'none';

      if (!restore) {
        window.parent.postMessage({ target: 'offscreen', command: 'play', url: fix(getFile(song)), song }, "*");
      }
      render(); save();
    }

    function togglePlay(e) { e?.stopPropagation(); window.parent.postMessage({ target: 'offscreen', command: 'toggle' }, "*"); }
    
    function toggleLoop() {
      isLooping = !isLooping;
      document.getElementById('loopBtn').classList.toggle('opacity-50', !isLooping);
      document.getElementById('loopBtn').classList.toggle('text-primary', isLooping);
      save();
    }

    function skip(d, e) {
      e?.stopPropagation();
      const idx = queue.findIndex(s => s.id === currentSong?.id);
      let next = idx + d;
      if (next >= queue.length) next = 0;
      if (next < 0) next = queue.length - 1;
      if (queue[next]) play(queue[next]);
    }

    function handleSeek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      window.parent.postMessage({ target: 'offscreen', command: 'seek', pct }, "*");
    }

    document.getElementById('cleanToggle').onchange = (e) => {
      cleanMode = e.target.checked;
      localStorage.setItem('cleanEnabled', cleanMode);
      if (currentSong) play(currentSong);
    };

    document.getElementById('slp-file').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const ids = ev.target.result.split('\n').map(x => x.trim());
        const pl = ids.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
        if (pl.length) {
          queue = pl; isPlaylist = true;
          document.getElementById('playlist-status').innerText = "Playlist Loaded (" + pl.length + " songs)";
          initView('custom');
          play(pl[0]);
        }
      };
      reader.readAsText(e.target.files[0]);
    };

    window.addEventListener("message", (e) => {
      if (e.data.type === 'UI_STATE') {
        document.getElementById('btn-play').className = `bi ${e.data.playing ? 'bi-pause-fill' : 'bi-play-fill'} fs-2`;
        document.getElementById('full-play-btn').className = `bi ${e.data.playing ? 'bi-pause-circle-fill' : 'bi-play-circle-fill'}`;
      }
      if (e.data.type === 'UI_PROG') {
        const pct = (e.data.c / e.data.d) * 100 + '%';
        document.getElementById('p-progress').style.width = pct;
        document.getElementById('full-progress').style.width = pct;
      }
      if (e.data.type === 'UI_NEXT' && !isLooping) skip(1);
      else if (e.data.type === 'UI_NEXT' && isLooping) play(currentSong);
    });

    window.onload = () => {
      document.getElementById('cleanToggle').checked = cleanMode;
      const cached = localStorage.getItem('starlight_cache');
      if (cached) {
        const d = JSON.parse(cached);
        isPlaylist = d.isPlaylist;
        isLooping = d.isLooping || false;
        queue = d.queueIds?.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean) || window.STARLIGHT_SONGS;
        if (d.currentId) play(window.STARLIGHT_SONGS.find(x => x.id == d.currentId), true);
        activeView = d.view || 'menu';
        if (isLooping) toggleLoop(); // Set UI state
        render(); switchDOM();
      }
    };
  </script>
</body>
</html>
