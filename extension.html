<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Starlight Sound Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html,
        body {
            background-color: #1a1a2e !important;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: white !important;
            font-family: 'Inter', sans-serif;
        }

        .view {
            display: none;
            height: 100vh;
            width: 100%;
            flex-direction: column;
        }

        .view.active {
            display: flex;
        }

        .now-playing-card {
            background-color: #27273f !important;
            border-bottom: 1px solid #3d3d5f !important;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
        }

        .menu-btn {
            background-color: #27273f !important;
            border: 1px solid #3d3d5f !important;
            color: white !important;
            padding: 15px;
            width: 250px;
            margin: 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .menu-btn:hover {
            border-color: #0d6efd !important;
            color: #0d6efd !important;
            transform: translateY(-2px);
        }

        .scroll-list {
            background-color: #1a1a2e !important;
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .song-item {
            background-color: #27273f !important;
            border: 1px solid #3d3d5f !important;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .song-item:hover {
            border-color: #0d6efd !important;
            background-color: #2d2d4d !important;
        }

        .thumb {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .footer-credit {
            color: #6c757d !important;
            font-size: 11px;
            text-align: center;
            padding: 8px;
        }

        h1 {
            color: #0d6efd !important;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div id="home-view" class="view active justify-content-center align-items-center">
        <h1>Starlight</h1>
        <div class="menu-btn" onclick="navigateTo('player')"><i class="bi bi-play-circle"></i> Player</div>
        <div class="menu-btn" onclick="navigateTo('playlist')"><i class="bi bi-music-note-list"></i> Playlists</div>
        <div class="footer-credit mt-4">ported to extension by pwR</div>
    </div>

    <div id="player-view" class="view">
        <div class="now-playing-card">
            <div class="d-flex justify-content-between mb-2">
                <i class="bi bi-chevron-left fs-5" style="cursor:pointer" onclick="navigateTo('home')"></i>
                <span class="small opacity-50">LIBRARY</span>
                <div style="width:20px"></div>
            </div>
            <h6 id="cur-title" class="fw-bold text-primary mb-0 text-truncate">Select a Song</h6>
            <p id="cur-artist" class="small text-secondary mb-2">Starlight Library</p>
            <div class="d-flex justify-content-center align-items-center gap-3">
                <i class="bi bi-skip-start-fill fs-3" style="cursor:pointer" onclick="handleCmd('PREV')"></i>
                <i id="m-play" class="bi bi-play-circle-fill fs-1 text-primary" style="cursor:pointer"
                    onclick="handleCmd('TOGGLE')"></i>
                <i class="bi bi-skip-end-fill fs-3" style="cursor:pointer" onclick="handleCmd('NEXT')"></i>
            </div>
        </div>
        <div class="scroll-list" id="library-container"></div>
        <div class="footer-credit">ported to extension by pwR</div>
    </div>

    <div id="playlist-view" class="view">
        <div class="now-playing-card">
            <div class="d-flex justify-content-between mb-2">
                <i class="bi bi-chevron-left fs-5" style="cursor:pointer" onclick="navigateTo('home')"></i>
                <label for="slp-input" class="btn btn-primary btn-sm py-0" style="font-size: 11px;">Import .slp</label>
                <input type="file" id="slp-input" class="d-none" accept=".slp">
            </div>
            <h6 id="pl-title" class="fw-bold text-primary mb-0">No Playlist</h6>
            <p id="pl-artist" class="small text-secondary mb-2">Load file</p>
            <div class="d-flex justify-content-center align-items-center gap-3">
                <i class="bi bi-skip-start-fill fs-4" style="cursor:pointer" onclick="handleCmd('PREV')"></i>
                <i id="pl-play" class="bi bi-play-circle-fill fs-2 text-primary" style="cursor:pointer"
                    onclick="handleCmd('TOGGLE')"></i>
                <i class="bi bi-skip-end-fill fs-4" style="cursor:pointer" onclick="handleCmd('NEXT')"></i>
            </div>
        </div>
        <div class="scroll-list" id="playlist-container"></div>
        <div class="footer-credit">ported to extension by pwR</div>
    </div>

    <audio id="fallback-audio"></audio>

    <script type="module" src="https://unixityyy.github.io/starlight/starlight.js"></script>
    <script>
        const BASE = "https://unixityyy.github.io/starlight";
        let localQueue = [];
        let localIdx = -1;
        let currentView = 'home';
        let currentSongData = null;

        // Helper to fix URLs
        const fix = (p) => (p && p.startsWith('http')) ? p : BASE + (p ? (p.startsWith('/') ? p : '/' + p) : '');

        // --- 1. NAVIGATION ---
        function navigateTo(v, shouldPersist = true) {
            currentView = v;
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(v + '-view');
            if (target) target.classList.add('active');
            if (shouldPersist) saveState();
        }

        // --- 2. PERSISTENCE HANDLERS ---
        function saveState() {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'SAVE_STATE',
                    payload: {
                        view: currentView,
                        song: currentSongData,
                        queue: localQueue
                    }
                }, "*");
            }
        }

        // --- 3. PLAYBACK ENGINE ---
        function playSong(song, queue, isRestore = false) {
            if (!song) return;

            localQueue = queue || window.STARLIGHT_SONGS || [];
            localIdx = localQueue.findIndex(s => s.id == song.id);
            currentSongData = song;

            // Update UI Text (Handles both Player and Playlist view labels)
            const titleEls = [document.getElementById('cur-title'), document.getElementById('pl-title')];
            const artistEls = [document.getElementById('cur-artist'), document.getElementById('pl-artist')];

            titleEls.forEach(el => { if (el) el.textContent = song.title });
            artistEls.forEach(el => { if (el) el.textContent = song.artist });

            // Command background player ONLY if not a restoration
            if (!isRestore) {
                window.parent.postMessage({
                    target: 'offscreen',
                    command: 'play',
                    url: fix(song.file)
                }, "*");
            }

            // Media Session (OS Level Controls)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: fix(song.cover || 'icon.png') }]
                });
                navigator.mediaSession.setActionHandler('play', () => togglePlayback());
                navigator.mediaSession.setActionHandler('pause', () => togglePlayback());
                navigator.mediaSession.setActionHandler('nexttrack', () => skip(1));
                navigator.mediaSession.setActionHandler('previoustrack', () => skip(-1));
            }

            if (!isRestore) saveState();
        }

        function togglePlayback() {
            window.parent.postMessage({ target: 'offscreen', command: 'toggle' }, "*");
        }

        function skip(dir) {
            const next = localQueue[localIdx + dir];
            if (next) playSong(next, localQueue);
        }

        // --- 4. EXTENSION MESSAGE HUB ---
        window.addEventListener("message", (e) => {
            // Restore logic
            if (e.data.type === 'RESTORE_STATE' && e.data.payload) {
                const p = e.data.payload;
                if (p.view) navigateTo(p.view, false);
                if (p.song) {
                    const q = (p.queue && p.queue.length) ? p.queue : window.STARLIGHT_SONGS;
                    playSong(p.song, q, true);
                }
            }

            // Progress bar updates
            if (e.data.type === 'prog') {
                const pct = (e.data.c / e.data.d * 100) + '%';
                ['bar-lib', 'bar-pl'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.width = pct;
                });
            }

            // Icon updates (Play vs Pause)
            if (e.data.type === 'state') {
                const icon = e.data.playing ? 'bi-pause-circle-fill' : 'bi-play-circle-fill';
                const toggles = [document.getElementById('m-play'), document.getElementById('pl-play')];
                toggles.forEach(el => { if (el) el.className = `bi ${icon} fs-1 text-primary` });
            }

            // Auto-next
            if (e.data.type === 'ended') skip(1);
        });

        // --- 5. INITIALIZATION & RENDERING ---
        function renderList(targetId, data, queueForClick) {
            const container = document.getElementById(targetId);
            if (!container) return;
            container.innerHTML = '';

            data.forEach(s => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                <img src="${fix(s.cover)}" class="thumb">
                <div class="text-truncate">
                    <div class="fw-bold small">${s.title}</div>
                    <div class="small text-secondary">${s.artist}</div>
                </div>
            `;
                div.onclick = () => playSong(s, queueForClick);
                container.appendChild(div);
            });
        }

        // SLP Import Logic
        const slpInput = document.getElementById('slp-input');
        if (slpInput) {
            slpInput.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    const ids = event.target.result.split('\n').map(x => x.trim());
                    const plQueue = ids.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
                    renderList('playlist-container', plQueue, plQueue);
                    if (plQueue.length) playSong(plQueue[0], plQueue);
                };
                reader.readAsText(file);
            };
        }

        // Startup: Wait for starlight.js, Render, then Restore
        const initInterval = setInterval(() => {
            if (window.STARLIGHT_SONGS && window.STARLIGHT_SONGS.length > 0) {
                clearInterval(initInterval);
                renderList('library-container', window.STARLIGHT_SONGS, window.STARLIGHT_SONGS);
                // Ask extension for saved state AFTER rendering
                window.parent.postMessage({ type: 'GET_STATE' }, "*");
            }
        }, 100);
    </script>
</body>

</html>
