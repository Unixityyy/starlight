---
layout: default
title: Starlight Playlists Editor
extra_js:
  - /assets/js/starlight.js
  - /assets/js/playlist-editor.js
---
<div class="wrap">
  <header class="hero playlists-hero">
    <h1>Starlight Playlists Editor</h1>
  </header>

  <div class="warning-banner warning-banner-compact">
    <span class="warning-icon">&#9888;</span>
    <p>Playlists are still in beta, there might be some bugs.</p>
  </div>

  <div class="editor-layout">
    <div class="editor-card">
      <h2>Library</h2>
      <p class="count">Click "Add" to put a song in your playlist.</p>
      <div class="library-list" id="editorLibraryList"></div>
    </div>

    <div class="editor-card">
      <h2>Your Playlist</h2>
      <p class="count" id="editorPlaylistCount">0 songs</p>
      <div class="library-list" id="editorPlaylistList"></div>

      <div class="editor-actions">
        <label class="editor-upload-btn">
          Import
          <input type="file" id="importInput" accept=".slp,text/plain" class="upload-input">
        </label>
        <button type="button" class="submit-btn" id="exportBtn">Export</button>
      </div>
    </div>
  </div>
</div>
