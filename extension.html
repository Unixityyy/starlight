<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlight Player</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { 
      --bg: #0f0f1e; 
      --card: #1a1a2e; 
      --accent: #0d6efd; 
      --text-muted: #a0a0c0; 
    }
    
    body { 
      background: var(--bg); 
      color: white; 
      font-family: 'Inter', sans-serif;
      height: 600px; 
      width: 400px; 
      overflow: hidden; 
      margin: 0; 
      position: relative;
    }

    /* View Management */
    .view { 
      display: none; 
      height: 100%; 
      flex-direction: column; 
      padding: 20px; 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .view.active { display: flex; }

    /* UI Components */
    .menu-item {
      background: var(--card); 
      border: 1px solid #3d3d5f;
      border-radius: 16px; 
      padding: 25px; 
      cursor: pointer;
      transition: 0.2s; 
      text-align: center; 
      margin-bottom: 15px;
    }
    .menu-item:hover { border-color: var(--accent); background: #22223d; }
    .menu-item i { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; display: block; }
    
    .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 100px; }
    
    /* Song Cards */
    .song-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 12px; cursor: pointer;
      margin-bottom: 8px; border: 1px solid transparent;
    }
    .song-card.active { background: rgba(13, 110, 253, 0.15); border-color: var(--accent); }
    .song-card img { 
      width: 48px; height: 48px; 
      border-radius: 8px; 
      object-fit: cover; 
      aspect-ratio: 1/1; 
    }

    /* Persistent Bottom Bar */
    .player-bar {
      background: rgba(26, 26, 46, 0.98); 
      backdrop-filter: blur(15px);
      border-top: 1px solid #3d3d5f; 
      padding: 10px 20px;
      position: absolute; 
      bottom: 0; 
      width: 100%; 
      z-index: 500;
      cursor: pointer;
    }

    /* Full Player View Special Styles */
    #v-player { 
      background: var(--bg); 
      z-index: 1000; 
      padding-bottom: 40px;
    }
    .big-art { 
      width: 280px; height: 280px; 
      object-fit: cover; 
      border-radius: 20px; 
      margin: 20px auto; 
      display: block;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
      aspect-ratio: 1/1;
    }
    .player-controls i { cursor: pointer; transition: 0.15s; }
    .player-controls i:hover { color: var(--accent); }
    .player-controls i:active { transform: scale(0.9); }
    
    .progress-wrap { height: 6px; background: #3d3d5f; border-radius: 10px; width: 100%; cursor: pointer; margin: 25px 0; }
    .progress-inner { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; position: relative; }
    .progress-inner::after { 
      content: ''; position: absolute; right: -6px; top: -4px; 
      width: 14px; height: 14px; background: white; border-radius: 50%; 
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #3d3d5f; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="v-menu" class="view active">
    <div class="text-center mb-4"><h2 class="fw-bold text-primary">Starlight</h2></div>
    <div class="menu-item" onclick="initView('library')"><i class="bi bi-music-note-list"></i><h5>Library</h5></div>
    <div class="menu-item" onclick="document.getElementById('slp-file').click()">
      <i class="bi bi-file-earmark-music"></i><h5>Import SLP</h5>
      <input type="file" id="slp-file" hidden accept=".slp">
    </div>
  </div>

  <div id="v-list" class="view">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-chevron-left fs-4" style="cursor:pointer" onclick="goHome()"></i>
        <h4 id="list-title" class="m-0 fw-bold">Library</h4>
      </div>
      <button id="unload-btn" class="btn btn-sm btn-outline-danger" onclick="unloadSLP()" style="display:none">Unload</button>
    </div>
    <div class="scroll-area" id="song-container"></div>
  </div>

  <div id="v-player" class="view">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <i class="bi bi-chevron-down fs-3" onclick="closePlayer()"></i>
        <span class="small fw-bold text-uppercase opacity-50">Now Playing</span>
        <i class="bi bi-list-stars fs-3" onclick="activeView='list'; switchDOM();"></i>
    </div>
    
    <img id="full-art" class="big-art" src="">
    
    <div class="text-center mt-3">
        <h3 id="full-title" class="fw-bold mb-1 text-truncate px-3">Song Title</h3>
        <p id="full-artist" class="text-primary fs-5">Artist Name</p>
    </div>

    <div class="progress-wrap" onclick="handleSeek(event)">
        <div class="progress-inner" id="full-progress"></div>
    </div>

    <div class="d-flex justify-content-center align-items-center gap-5 player-controls">
        <i class="bi bi-skip-start-fill fs-1" onclick="skip(-1)"></i>
        <i id="full-play-btn" class="bi bi-play-circle-fill" style="font-size: 4.5rem;" onclick="togglePlay()"></i>
        <i class="bi bi-skip-end-fill fs-1" onclick="skip(1)"></i>
    </div>

    <div class="mt-4">
        <p class="small text-secondary mb-2 fw-bold">PLAYLIST QUEUE</p>
        <div id="mini-queue" class="scroll-area" style="max-height: 150px;"></div>
    </div>
  </div>

  <div class="player-bar" id="p-bar" style="display:none;" onclick="openPlayer(event)">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3 overflow-hidden">
        <img id="p-cover" src="" style="width:44px; height:44px; border-radius:6px; object-fit: cover;">
        <div class="text-truncate">
          <div id="p-title" class="fw-bold small text-truncate" style="max-width: 150px;">Title</div>
          <div id="p-artist" class="text-secondary" style="font-size:11px;">Artist</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <i id="btn-play" class="bi bi-play-fill fs-1" onclick="togglePlay(event)"></i>
        <i class="bi bi-skip-end-fill fs-2" onclick="skip(1, event)"></i>
      </div>
    </div>
    <div style="height:3px; background:#222; margin-top:8px; border-radius:2px;">
        <div id="p-progress" style="height:100%; background:var(--accent); width:0%;"></div>
    </div>
  </div>

  <script src="https://unixityyy.github.io/starlight/starlight.js"></script>
  <script>
    const BASE = "https://unixityyy.github.io/starlight";
    let queue = [], currentSong = null, activeView = 'menu', isPlaylist = false;

    const fix = (p) => (p && p.startsWith('http')) ? p : BASE + (p ? (p.startsWith('/') ? p : '/' + p) : '');

    function saveToLocal() {
      const data = {
        view: activeView,
        currentId: currentSong ? currentSong.id : null,
        queueIds: queue.map(s => s.id),
        isPlaylist: isPlaylist
      };
      localStorage.setItem('starlight_cache', JSON.stringify(data));
    }

    function initView(mode) {
      activeView = 'list';
      if (mode === 'library') {
        queue = window.STARLIGHT_SONGS;
        isPlaylist = false;
        document.getElementById('list-title').innerText = "Library";
        document.getElementById('unload-btn').style.display = 'none';
      }
      render();
      switchDOM();
    }

    function goHome() { activeView = 'menu'; switchDOM(); }
    
    function openPlayer(e) {
      if(e.target.closest('i')) return;
      activeView = 'player';
      switchDOM();
    }
    
    function closePlayer() {
      activeView = (isPlaylist) ? 'list' : 'menu';
      switchDOM();
    }

    function switchDOM() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById('v-' + activeView);
      if(target) target.classList.add('active');
      saveToLocal();
    }

    function render() {
      const container = document.getElementById('song-container');
      const miniQueue = document.getElementById('mini-queue');
      container.innerHTML = '';
      miniQueue.innerHTML = '';

      queue.forEach((s) => {
        const isActive = currentSong?.id === s.id;
        const itemHtml = `
            <img src="${fix(s.cover)}">
            <div class="text-truncate">
                <div class="fw-bold">${s.title}</div>
                <div class="small text-secondary">${s.artist}</div>
            </div>`;
        
        const div = document.createElement('div');
        div.className = `song-card ${isActive ? 'active' : ''}`;
        div.innerHTML = itemHtml;
        div.onclick = () => play(s);
        container.appendChild(div);

        // Populate the queue list in the full player view
        const qDiv = document.createElement('div');
        qDiv.className = `song-card ${isActive ? 'active' : ''}`;
        qDiv.innerHTML = itemHtml;
        qDiv.onclick = () => play(s);
        miniQueue.appendChild(qDiv);
      });
    }

    function play(song, isRestore = false) {
      currentSong = song;
      document.getElementById('p-bar').style.display = 'block';
      
      // Update UI elements across all views
      const fields = {
        'p-title': song.title, 'full-title': song.title,
        'p-artist': song.artist, 'full-artist': song.artist
      };
      for (let id in fields) document.getElementById(id).innerText = fields[id];
      
      document.getElementById('p-cover').src = fix(song.cover);
      document.getElementById('full-art').src = fix(song.cover);

      if (!isRestore) {
        window.parent.postMessage({ target: 'offscreen', command: 'play', url: fix(song.file), song: song }, "*");
      }
      render();
      saveToLocal();
    }

    function togglePlay(e) { 
      if(e) e.stopPropagation();
      window.parent.postMessage({ target: 'offscreen', command: 'toggle' }, "*"); 
    }

    function skip(d, e) {
      if(e) e.stopPropagation();
      const idx = queue.findIndex(s => s.id === currentSong?.id);
      const nextIdx = idx + d;
      if (queue[nextIdx]) play(queue[nextIdx]);
      else if (d > 0 && queue[0]) play(queue[0]); // Loop to start
    }

    function handleSeek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      window.parent.postMessage({ target: 'offscreen', command: 'seek', pct }, "*");
    }

    // Playlist Import
    document.getElementById('slp-file').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const ids = ev.target.result.split('\n').map(x => x.trim());
        const pl = ids.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
        if (pl.length) {
          queue = pl; isPlaylist = true;
          document.getElementById('list-title').innerText = "Playlist";
          document.getElementById('unload-btn').style.display = 'block';
          activeView = 'list'; 
          render(); 
          play(pl[0]);
        }
      };
      reader.readAsText(e.target.files[0]);
    };

    function unloadSLP() { initView('library'); }

    // Listener for Background/Offscreen Script
    window.addEventListener("message", (e) => {
      if (e.data.type === 'UI_STATE') {
        const playIcon = e.data.playing ? 'bi-pause-fill' : 'bi-play-fill';
        const fullIcon = e.data.playing ? 'bi-pause-circle-fill' : 'bi-play-circle-fill';
        document.getElementById('btn-play').className = `bi ${playIcon} fs-1`;
        document.getElementById('full-play-btn').className = `bi ${fullIcon}`;
      }
      if (e.data.type === 'UI_PROG') {
        const pct = `${(e.data.c / e.data.d) * 100}%`;
        document.getElementById('p-progress').style.width = pct;
        document.getElementById('full-progress').style.width = pct;
      }
      if (e.data.type === 'UI_NEXT') skip(1);
    });

    window.onload = () => {
      const cached = localStorage.getItem('starlight_cache');
      if (cached) {
        const d = JSON.parse(cached);
        isPlaylist = d.isPlaylist;
        if (d.queueIds?.length) {
          queue = d.queueIds.map(id => window.STARLIGHT_SONGS.find(s => s.id == id)).filter(Boolean);
        } else {
          queue = window.STARLIGHT_SONGS;
        }

        if (isPlaylist) {
          document.getElementById('list-title').innerText = "Playlist";
          document.getElementById('unload-btn').style.display = 'block';
        }

        if (d.currentId) {
          const s = window.STARLIGHT_SONGS.find(x => x.id == d.currentId);
          if (s) play(s, true); // Restore metadata without restarting audio
        }
        
        activeView = (d.view === 'player') ? 'list' : (d.view || 'menu');
        switchDOM();
        render();
      }
    };
  </script>
</body>
</html>
