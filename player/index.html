<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Starlight Sound Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color:#1a1a2e;
      font-family:Inter,sans-serif;
    }

    .card {
      background:#27273f;
      border:1px solid #3d3d5f;
      border-radius:12px;
    }

    header h1 {
      font-size:3rem;
      font-weight:bold;
      text-align:center;
      color:#0d6efd;
      margin-bottom:.5rem;
    }

    header p {
      text-align:center;
      color:#c0c0ff;
      margin-bottom:.25rem;
    }

    .explicit-tag {
      background:#5d3587;
      color:white;
      font-size:.75rem;
      padding:1px 4px;
      border-radius:3px;
      font-weight:700;
    }

    /* Player Specifics */
    .progress { height:8px; cursor:pointer; background: #1a1a2e; }
    .icon-btn { font-size:1.8rem; cursor:pointer; transition: 0.2s; }
    .icon-btn:hover { color:#0d6efd; }
    
    .list-group-item {
      background:#27273f;
      border:1px solid #3d3d5f;
      color: white;
      transition: 0.2s;
      cursor: pointer;
    }
    
    .list-group-item:hover {
      background:#3d3d5f;
    }

    .list-group-item.active-song {
      border-left: 4px solid #0d6efd;
      background: #2d2d4d;
    }
  </style>
</head>

<body class="text-white">

<nav class="container mb-4">
  <ul class="nav nav-tabs justify-content-center">
    <li class="nav-item">
      <a class="nav-link" href="../">Home</a>
    </li>
    <li class="nav-item">
      <a class="nav-link active" href="./">Player</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="../request">Request Form</a>
    </li>
  </ul>
</nav>

<div class="container py-4">

  <header class="mb-5">
    <h1>Starlight Sound Player</h1>
    <p>Listen to your favorite tracks seamlessly.</p>
    
    <div class="d-flex justify-content-center mt-3">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="cleanToggle">
        <label class="form-check-label" for="cleanToggle">Clean</label>
      </div>
    </div>
  </header>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card p-4 shadow-lg sticky-top" style="top: 20px;">
        <div class="text-center mb-4">
          <div id="playerStatus" class="small text-uppercase tracking-widest text-secondary mb-2">Now Playing</div>
          <h3 id="currentTitle" class="fw-bold text-primary mb-1">Nothing playing</h3>
          <p id="currentArtist" class="text-secondary">Select a song</p>
          <span id="currentExplicit" class="explicit-tag" style="display:none;">E</span>
        </div>

        <div class="progress mb-3" id="progressBar">
          <div class="progress-bar bg-primary" id="progress" style="width: 0%"></div>
        </div>

        <div class="d-flex justify-content-center align-items-center gap-4">
          <i id="loopBtn" class="bi bi-arrow-repeat icon-btn opacity-50" title="Loop"></i>
          <i id="playPause" class="bi bi-play-circle-fill icon-btn" style="font-size: 3rem;"></i>
          <label for="upload" title="Upload Local File">
            <i class="bi bi-cloud-upload icon-btn"></i>
          </label>
          <input type="file" id="upload" class="d-none" accept="audio/*">
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card p-4">
        <h5 class="fw-bold mb-3">Library</h5>
        <div class="list-group list-group-flush" id="library">
          </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script src="../starlight.js"></script>

<script>
  const audio = document.getElementById('audio');
  const playPause = document.getElementById('playPause');
  const loopBtn = document.getElementById('loopBtn');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const currentTitle = document.getElementById('currentTitle');
  const currentArtist = document.getElementById('currentArtist');
  const currentExplicit = document.getElementById('currentExplicit');
  const upload = document.getElementById('upload');
  const library = document.getElementById('library');
  const cleanToggle = document.getElementById('cleanToggle');

  let cleanMode = localStorage.getItem('cleanEnabled') === 'true';
  cleanToggle.checked = cleanMode;
  let currentSong = null;

  function getSongFile(song) {
    return (cleanMode && song.file_clean) ? song.file_clean : song.file;
  }

  function updateUI(title, artist, isExplicit) {
    currentTitle.textContent = title;
    currentArtist.textContent = artist;
    currentExplicit.style.display = isExplicit ? 'inline-block' : 'none';
    
    document.querySelectorAll('.list-group-item').forEach(el => {
      el.classList.toggle('active-song', el.dataset.title === title);
    });
  }

  playPause.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => playPause.className = 'bi bi-pause-circle-fill icon-btn';
  audio.onpause = () => playPause.className = 'bi bi-play-circle-fill icon-btn';

  loopBtn.onclick = () => {
    audio.loop = !audio.loop;
    loopBtn.classList.toggle('opacity-50', !audio.loop);
    loopBtn.classList.toggle('text-primary', audio.loop);
  };

  audio.ontimeupdate = () => {
    if (!audio.duration) return;
    progress.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
  };

  progressBar.onclick = e => {
    const rect = progressBar.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  };

  upload.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    currentSong = null;
    audio.src = URL.createObjectURL(file);
    updateUI(file.name, 'Local File', false);
    audio.play();
  };

  cleanToggle.onchange = () => {
    cleanMode = cleanToggle.checked;
    localStorage.setItem('cleanEnabled', cleanMode);
    if (currentSong) {
      const time = audio.currentTime;
      audio.src = `../${getSongFile(currentSong)}`;
      audio.currentTime = time;
      audio.play();
    }
  };

  function renderLibrary() {
    library.innerHTML = '';
    window.STARLIGHT_SONGS.forEach(song => {
      const li = document.createElement('div');
      li.className = 'list-group-item d-flex justify-content-between align-items-center p-3 mb-2 rounded';
      li.dataset.title = song.title;
      li.innerHTML = `
        <div>
          <div class="fw-bold">${song.title}</div>
          <div class="small text-secondary">${song.artist}</div>
        </div>
        ${song.isExplicit ? '<span class="explicit-tag">E</span>' : ''}
      `;

      li.onclick = () => {
        currentSong = song;
        audio.src = `../${getSongFile(song)}`;
        updateUI(song.title, song.artist, song.isExplicit);
        audio.play();
      };
      library.appendChild(li);
    });
  }

  renderLibrary();
</script>
</body>
</html>
