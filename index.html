<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <script type="module" src="/navbar.js"></script>
  <meta charset="UTF-8">
  <title>Starlight Sound Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="dist/output.css" rel="stylesheet">
  <script type="module" src="./auth.js"></script>

  <style>
    body {
      background-color:#1a1a2e;
      font-family:Inter,sans-serif;
    }

    .card {
      background:#27273f;
      border:1px solid #3d3d5f;
      border-radius:12px;
      transition:.2s;
    }

    .card:hover {
      transform:translateY(-5px);
      box-shadow:0 10px 20px rgba(0,0,0,.5);
    }

    .album-cover {
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-bottom:1px solid #3d3d5f;
      max-height:200px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .explicit-tag {
      background:#5d3587;
      color:white;
      font-size:.75rem;
      padding:1px 4px;
      border-radius:3px;
      font-weight:700;
    }

    .request-card {
      background:#5d3587;
      color:white;
      text-decoration:none;
      height:100%;
    }

    .request-card:hover {
      background:#7b4aa5;
      color:white;
    }

    header h1 {
      font-size:3rem;
      font-weight:bold;
      text-align:center;
      color:#0d6efd;
      margin-bottom:.5rem;
    }

    header p {
      text-align:center;
      color:#c0c0ff;
      margin-bottom:.25rem;
    }
  </style>
</head>

<body class="text-white">

<nav class="mb-4"></nav>

<div class="container py-4">

  <header class="mb-4">
    <h1>Starlight Sound Library</h1>
    <p id="shitidk"></p>
    <p class="small">
      Songs marked with <span class="explicit-tag">E</span> are explicit
    </p>

    <!-- CLEAN TOGGLE -->
    <div class="d-flex justify-content-center mt-3">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="cleanToggle">
        <label class="form-check-label" for="cleanToggle">
          Clean
        </label>
      </div>
    </div>
  </header>

  <div id="song-grid"
       class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">

    <div class="col">
      <a href="./request"
         class="card request-card shadow-lg">
        <div class="d-flex flex-column align-items-center justify-content-center p-4 text-center h-100">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="40" height="40"
               fill="currentColor"
               class="mb-3"
               viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"/>
          </svg>
          <h5 class="fw-bold">Request a Song</h5>
          <p class="small opacity-75">
            Missing something? Request a song through our form.
          </p>
          <span class="btn btn-outline-light btn-sm mt-2">
            Open Form
          </span>
        </div>
      </a>
    </div>

  </div>
</div>

    const col = document.createElement('div');
    col.className = 'col';

          <a href="${encodeURI(getSongFile(song))}" download

            Download

  function renderSongs() {
    grid.querySelectorAll('.col:not(:first-child)').forEach(e => e.remove());
