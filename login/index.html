<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-no-nav=""> <!-- js realized the script checks if a nav element is present but-->
                                                     <!-- im too lazy to change-->
<head>
  <script type="module" src="/navbar.js"></script>
  <meta charset="UTF-8">
  <title>Starlight Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#1a1a2e; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background:#27273f; border:1px solid #3d3d5f; border-radius:12px; width: 100%; max-width: 400px; }
    .btn-social { font-weight: 500; transition: opacity 0.2s; border: none; }
    .btn-social:hover { opacity: 0.9; }
    .google-btn { background: white; color: #757575; }
    .microsoft-btn { background: #2f2f2f; color: white; }
    .divider { display: flex; align-items: center; text-align: center; color: #555; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #3d3d5f; }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
  </style>
</head>
<body class="text-white">
  <div class="card p-4 shadow-lg">
    <div class="text-center">
      <h2 class="text-primary fw-bold mb-2">Starlight</h2>
      <p class="text-secondary small mb-4">Sign in to your account</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small">Email address</label>
        <input type="email" id="email" class="form-control bg-dark text-white border-secondary" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" id="password" class="form-control bg-dark text-white border-secondary" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-2">Sign In</button>
      <button type="button" id="signUpBtn" class="btn btn-outline-secondary btn-sm w-100">Create Account</button>
    </form>

    <div class="divider">or</div>
    
    <button id="googleBtn" class="btn btn-social google-btn w-100 d-flex align-items-center justify-content-center py-2 mb-2">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" class="me-2">
        Continue with Google
    </button>

    <button id="microsoftBtn" class="btn btn-social microsoft-btn w-100 d-flex align-items-center justify-content-center py-2">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Microsoft_icon.svg/960px-Microsoft_icon.svg.png" width="20" class="me-2">
        Continue with Microsoft
    </button>

    <div id="msg" class="text-danger small mt-3 text-center"></div>
    
    <div class="text-center mt-4 border-top pt-3">
        <a href="../index.html" class="text-secondary small text-decoration-none">Back to Home</a>
    </div>
  </div>

  <script type="module">
    import { auth, googleProvider, microsoftProvider, fetchSignInMethodsForEmail } from '../auth.js';
    import { 
      signInWithPopup, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      linkWithCredential,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const msg = document.getElementById('msg');
    const isElectron = navigator.userAgent.toLowerCase().includes('electron');
    const home = isElectron ? "../index.html" : "../";

    let pendingCredential = null;

    const handleAuth = async (provider) => {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = home;
      } catch (err) {
        msg.className = "text-danger small mt-3 text-center";
        msg.textContent = err.message;
      }
    };
    
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      signInWithEmailAndPassword(auth, email.value, password.value)
        .then(() => window.location.href = home)
        .catch(err => {
            msg.className = "text-danger small mt-3 text-center";
            msg.textContent = err.message;
        });
    };

    document.getElementById('signUpBtn').onclick = async () => {
      try {
        const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);

        const res = await fetch('https://api.unixityyy.dev/api/v1/verify/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value })
        });
        const data = await res.json();

        if (data.method === 'standard') {
          await sendEmailVerification(cred.user);
        }

        window.location.href = isElectron ? "../verify/index.html" : "../verify/";
      } catch (err) {
        msg.className = "text-danger small mt-3 text-center";
        msg.textContent = err.message;
      }
    };

    document.getElementById('googleBtn').onclick = () => handleAuth(googleProvider);
    document.getElementById('microsoftBtn').onclick = () => handleAuth(microsoftProvider);
  </script>
</body>
</html>
