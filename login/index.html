<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Starlight Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#1a1a2e; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background:#27273f; border:1px solid #3d3d5f; border-radius:12px; width: 100%; max-width: 400px; }
  </style>
</head>
<body class="text-white">
  <div class="card p-4 shadow-lg">
    <h2 class="text-center text-primary fw-bold mb-4">Starlight</h2>
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="Email Address">
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Password">
    </div>
    <button id="loginBtn" class="btn btn-primary w-100 mb-2">Login</button>
    <button id="signupBtn" class="btn btn-outline-light w-100">Sign Up</button>
    <div id="msg" class="text-danger small mt-3 text-center"></div>
    <div class="text-center mt-3">
        <a href="../index.html" class="text-secondary small">Back to Home</a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../auth.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const msg = document.getElementById('msg');
    
    const isElectron = navigator.userAgent.toLowerCase().includes('electron');
    const home = isElectron ? "../index.html" : "../";

    document.getElementById('loginBtn').onclick = () => {
      signInWithEmailAndPassword(auth, emailInput.value, passInput.value)
        .then(() => window.location.href = home)
        .catch(err => {
          msg.textContent = err.message;
        });
    };

    document.getElementById('signupBtn').onclick = () => {
      createUserWithEmailAndPassword(auth, emailInput.value, passInput.value)
        .then(() => window.location.href = home)
        .catch(err => {
          msg.textContent = err.message;
        });
    };
  </script>
</body>
</html>
