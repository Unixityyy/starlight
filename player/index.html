---
layout: default
title: Starlight Sound Player
extra_js:
  - /assets/js/data.js
  - /assets/js/player.js
---
<div class="wrap">
  <header class="hero page-hero">
    <h1>Starlight Sound Player</h1>
  </header>

  <div class="player-layout">

    <div class="now-playing-card">
      <div class="now-playing-cover">
        <img id="npCover" src="/favicon.ico" alt="Cover art">
      </div>
      <h2 class="now-playing-title" id="npTitle">Nothing playing yet</h2>
      <p class="now-playing-artist" id="npArtist">Pick a song from the library</p>

      <div class="progress-row">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <div class="time-row">
          <span id="timeCurrent">0:00</span>
          <span id="timeDuration">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="repeatBtn" type="button" title="Repeat" aria-pressed="false">
          <span class="icon icon-repeat"></span>
        </button>

        <button class="play-btn" id="playBtn" type="button" title="Play">
          <img src="/assets/img/play.svg" alt="">
        </button>

        <button class="ctrl-btn" id="uploadBtn" type="button" title="Upload a song">
          <span class="icon icon-upload-song"></span>
        </button>
        <input type="file" id="uploadInput" class="upload-input" accept="audio/*">
      </div>
    </div>

    <div class="library-card">
      <h2>Library</h2>
      <p class="count" id="libraryCount"></p>
      <div class="library-list" id="libraryList">
      </div>
    </div>

  </div>
</div>

<audio id="audio" preload="auto"></audio>
