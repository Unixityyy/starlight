<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-no-nav="">
<head>
  <meta charset="UTF-8">
  <title>Starlight Verify Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <style>
    body { background-color:#1a1a2e; font-family:Inter,sans-serif; margin:0; }
    .card { background:#27273f; border:1px solid #3d3d5f; border-radius:12px; }
    .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .gate .card { width:100%; max-width:360px; }
    .request-row { background:#1a1a2e; border:1px solid #3d3d5f; border-radius:8px; }
    .code-tag { font-family:monospace; background:#0d1117; padding:2px 8px; border-radius:4px; letter-spacing:1px; }
  </style>
</head>
<body class="text-white">

  <div id="gate" class="gate">
    <div class="card p-4 shadow-lg">
      <h4 class="text-primary text-center mb-3">Admin</h4>
      <input type="password" id="tokenInput" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Admin token">
      <button id="enterBtn" class="btn btn-primary w-100">Enter</button>
      <div id="gateMsg" class="text-danger small mt-2 text-center"></div>
    </div>
  </div>

  <div id="panel" class="container py-4 d-none">
    <h2 class="text-primary fw-bold mb-4">Pending Verifications</h2>
    <div id="list"></div>
    <div id="empty" class="text-secondary d-none">Nothing waiting on review.</div>
  </div>

  <script>
    const API_BASE = 'https://api.unixityyy.dev/api/v1/verify';
    let token = sessionStorage.getItem('starlight_admin_token') || '';

    const gate = document.getElementById('gate');
    const panel = document.getElementById('panel');
    const gateMsg = document.getElementById('gateMsg');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');

    function docIdFromLink(link) {
      const match = link.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function safeViewLink(link) {
      const id = docIdFromLink(link);
      return id ? `https://docs.google.com/document/d/${id}/export?format=txt` : link;
    }

    async function loadPending() {
      const res = await fetch(`${API_BASE}/admin/pending`, {
        headers: { 'x-admin-token': token }
      });

      if (res.status === 403) {
        gate.classList.remove('d-none');
        panel.classList.add('d-none');
        gateMsg.textContent = 'Invalid token.';
        sessionStorage.removeItem('starlight_admin_token');
        return;
      }

      const rows = await res.json();
      list.innerHTML = '';

      if (rows.length === 0) {
        empty.classList.remove('d-none');
        return;
      }
      empty.classList.add('d-none');

      rows.forEach(row => {
        const div = document.createElement('div');
        div.className = 'request-row p-3 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2';
        div.innerHTML = `
          <div>
            <div class="fw-bold">${row.email}</div>
            <div class="small text-secondary">code: <span class="code-tag">${row.code}</span></div>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <a href="${safeViewLink(row.doc_link)}" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm">Download doc</a>
            <button class="btn btn-success btn-sm" data-action="approve" data-email="${row.email}">Approve</button>
            <button class="btn btn-outline-danger btn-sm" data-action="reject" data-email="${row.email}">Reject</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    list.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, email } = btn.dataset;
      btn.disabled = true;

      await fetch(`${API_BASE}/admin/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify({ email })
      });

      loadPending();
    });

    document.getElementById('enterBtn').onclick = () => {
      token = document.getElementById('tokenInput').value;
      sessionStorage.setItem('starlight_admin_token', token);
      gate.classList.add('d-none');
      panel.classList.remove('d-none');
      loadPending();
    };

    if (token) {
      gate.classList.add('d-none');
      panel.classList.remove('d-none');
      loadPending();
    }
  </script>
</body>
</html>
